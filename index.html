    <style>
        :root {
            --noir: #0a0a0a; --gris-fonce: #121212; --gris: #a0a0a0;
            --gris-clair: #d4d4d4; --blanc: #f5f5f5; --accent: #c9a96e;
            --accent-hover: #b8954a; --accent-dim: rgba(201,169,110,0.08);
            --glass: rgba(255,255,255,0.04); --glass-border: rgba(255,255,255,0.08);
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.15); --shadow-md: 0 10px 35px rgba(0,0,0,0.22);
            --shadow-lg: 0 20px 50px rgba(0,0,0,0.35); --radius-sm: 12px;
            --radius-md: 16px; --radius-lg: 20px; --radius-full: 50px;
            --transition-fast: 0.2s ease; --transition-base: 0.3s ease; --transition-slow: 0.5s ease;
            --nav-height: 72px; --nav-height-scrolled: 56px;
        }
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; scroll-padding-top: var(--nav-height); }
        @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif; background: var(--noir);
            color: var(--blanc); line-height: 1.65; overflow-x: hidden;
            -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
            background-image:
                radial-gradient(circle at 15% 20%, rgba(201,169,110,0.07), transparent 35%),
                radial-gradient(circle at 85% 80%, rgba(255,255,255,0.03), transparent 30%);
        }
        ::selection { background: rgba(201,169,110,0.3); color: var(--blanc); }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--noir); }
        ::-webkit-scrollbar-thumb { background: var(--gris-fonce); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        .skip-link {
            position: absolute; top: -100%; left: 50%; transform: translateX(-50%);
            padding: 0.75rem 1.5rem; background: var(--accent); color: var(--noir);
            font-weight: 600; border-radius: 0 0 var(--radius-sm) var(--radius-sm);
            z-index: 10000; text-decoration: none; transition: top var(--transition-fast);
        }
        .skip-link:focus { top: 0; outline: 3px solid var(--blanc); outline-offset: -3px; }

        nav {
            position: fixed; top: 0; width: 100%; height: var(--nav-height);
            padding: 0 4rem; display: flex; justify-content: space-between; align-items: center;
            z-index: 1000; background: var(--glass);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-bottom: 1px solid var(--glass-border); box-shadow: var(--shadow-md);
            transition: all var(--transition-base);
        }
        nav.scrolled { height: var(--nav-height-scrolled); background: rgba(16,16,16,0.92); box-shadow: 0 4px 20px rgba(0,0,0,0.3); }

        .logo { font-family: 'Playfair Display', Georgia, serif; font-size: 1.5rem; font-weight: 400; color: var(--blanc); text-decoration: none; letter-spacing: 1px; transition: transform var(--transition-fast); }
        .logo:hover { transform: scale(1.02); }
        .logo span { color: var(--accent); }

        .nav-links { display: flex; gap: 2.5rem; list-style: none; }
        .nav-links a { color: var(--gris); text-decoration: none; font-size: 0.8rem; font-weight: 500; letter-spacing: 0.8px; text-transform: uppercase; transition: color var(--transition-base); position: relative; padding: 0.5rem 0; }
        .nav-links a::after { content: ''; position: absolute; bottom: 0; left: 0; width: 0; height: 2px; background: var(--accent); transition: width var(--transition-base); border-radius: 2px; }
        .nav-links a:hover, .nav-links a:focus, .nav-links a.active { color: var(--blanc); outline: none; }
        .nav-links a:hover::after, .nav-links a:focus::after, .nav-links a.active::after { width: 100%; }
        .nav-links a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 2px; }

        .menu-toggle { display: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.15); background: transparent; color: var(--blanc); align-items: center; justify-content: center; cursor: pointer; font-size: 1.2rem; transition: all var(--transition-fast); }
        .menu-toggle:hover { border-color: var(--accent); color: var(--accent); }
        .menu-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        .hero { min-height: 100dvh; display: flex; align-items: center; padding: calc(var(--nav-height) + 2rem) 4rem 4rem; position: relative; overflow: hidden; isolation: isolate; }
        .hero::before { content: ''; position: absolute; top: -30%; right: -5%; width: 600px; height: 600px; background: radial-gradient(circle, rgba(201,169,110,0.07) 0%, transparent 65%); border-radius: 50%; pointer-events: none; animation: pulse-glow 6s ease-in-out infinite; }
        @keyframes pulse-glow { 0%,100% { opacity: 0.6; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }
        .hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(100deg, rgba(10,10,10,0.97) 0%, rgba(10,10,10,0.75) 55%, rgba(10,10,10,0.35) 100%); z-index: 0; pointer-events: none; }
        .hero-content { max-width: 640px; z-index: 2; }
        .hero-tag { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.45rem 1.3rem; background: var(--accent-dim); border: 1px solid rgba(201,169,110,0.2); color: var(--accent); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 2.5px; border-radius: var(--radius-full); margin-bottom: 1.8rem; animation: fadeInUp 0.8s ease both; }
        .hero-tag::before { content: ''; width: 6px; height: 6px; background: var(--accent); border-radius: 50%; animation: blink 2s ease-in-out infinite; }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
        .hero h1 { font-family: 'Playfair Display', Georgia, serif; font-size: clamp(2.2rem, 5vw, 4.2rem); font-weight: 400; line-height: 1.08; margin-bottom: 1.4rem; animation: fadeInUp 0.8s ease 0.15s both; }
        .hero h1 em { color: var(--accent); font-style: italic; }
        .hero p { font-size: clamp(1rem, 1.5vw, 1.15rem); color: var(--gris); max-width: 500px; margin-bottom: 2.5rem; animation: fadeInUp 0.8s ease 0.3s both; }
        .hero-buttons { display: flex; gap: 1rem; flex-wrap: wrap; animation: fadeInUp 0.8s ease 0.45s both; }

        .btn { padding: 0.9rem 2.2rem; font-size: 0.85rem; font-weight: 500; text-decoration: none; border-radius: var(--radius-full); transition: all var(--transition-base); cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 0.5rem; position: relative; overflow: hidden; font-family: inherit; }
        .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
        .btn-primary { background: var(--accent); color: var(--noir); box-shadow: 0 4px 15px rgba(201,169,110,0.25); }
        .btn-primary:hover { background: var(--accent-hover); transform: translateY(-2px); box-shadow: 0 12px 35px rgba(201,169,110,0.35); }
        .btn-primary:active { transform: translateY(0); }
        .btn-secondary { background: rgba(255,255,255,0.04); color: var(--blanc); border: 1px solid rgba(255,255,255,0.12); backdrop-filter: blur(12px); }
        .btn-secondary:hover { border-color: rgba(255,255,255,0.35); background: rgba(255,255,255,0.08); transform: translateY(-2px); }

        .hero-image { position: absolute; right: 5%; top: 50%; transform: translateY(-50%); width: 380px; height: 480px; border-radius: var(--radius-lg); overflow: hidden; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.02); backdrop-filter: blur(12px); box-shadow: var(--shadow-lg); animation: fadeIn 1s ease 0.5s both; display: flex; align-items: center; justify-content: center; z-index: 1; }
        .hero-image .avatar-placeholder { font-size: 5rem; opacity: 0.35; color: var(--accent); filter: drop-shadow(0 0 30px rgba(201,169,110,0.2)); }
        .hero-image::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 45%; background: linear-gradient(to top, var(--noir), transparent); }

        section { padding: 7rem 4rem; position: relative; }
        .section-header { text-align: center; margin-bottom: 4rem; }
        .section-tag { color: var(--accent); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 3.5px; margin-bottom: 0.8rem; display: block; font-weight: 500; }
        .section-title { font-family: 'Playfair Display', Georgia, serif; font-size: clamp(1.8rem, 3.5vw, 2.8rem); font-weight: 400; margin-bottom: 0.8rem; }
        .section-subtitle { color: var(--gris); max-width: 600px; margin: 0 auto; font-size: 1.02rem; }

        .projets-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 2rem; }
        .projet-card { background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.015)); backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%); border-radius: var(--radius-md); overflow: hidden; transition: all var(--transition-slow); border: 1px solid rgba(255,255,255,0.06); box-shadow: inset 0 1px 0 rgba(255,255,255,0.04), var(--shadow-sm); text-decoration: none; color: inherit; display: block; }
        .projet-card:hover { transform: translateY(-8px) scale(1.01); border-color: rgba(201,169,110,0.25); box-shadow: 0 25px 55px rgba(0,0,0,0.45); }
        .projet-card:focus-within { border-color: var(--accent); outline: none; }
        .projet-image { width: 100%; height: 210px; overflow: hidden; position: relative; background: var(--gris-fonce); display: flex; align-items: center; justify-content: center; color: var(--gris); font-size: 0.8rem; }
        .projet-image .icon-large { font-size: 3.2rem; opacity: 0.25; transition: transform var(--transition-slow); }
        .projet-card:hover .projet-image .icon-large { transform: scale(1.1) rotate(-3deg); }
        .projet-image img { width: 100%; height: 100%; object-fit: cover; transition: transform var(--transition-slow); }
        .projet-card:hover .projet-image img { transform: scale(1.08); }
        .projet-info { padding: 1.6rem; }
        .projet-categorie { color: var(--accent); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 600; }
        .projet-titre { font-family: 'Playfair Display', Georgia, serif; font-size: 1.25rem; font-weight: 400; margin: 0.35rem 0 0.5rem; }
        .projet-desc { color: var(--gris); font-size: 0.92rem; line-height: 1.6; }
        .projet-link { display: inline-flex; align-items: center; gap: 0.4rem; margin-top: 1rem; color: var(--accent); font-size: 0.82rem; font-weight: 500; text-decoration: none; transition: gap var(--transition-fast); }
        .projet-link:hover { gap: 0.7rem; }
        .projet-link::after { content: '→'; }

        /* Compétences : on utilise une liste ul */
        .skills-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
            list-style: none;
            padding: 0;
        }
        .skill-card {
            background: var(--gris-fonce);
            border-radius: var(--radius-md);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 2rem 1.5rem;
            text-align: center;
            transition: all var(--transition-base);
            position: relative;
            overflow: hidden;
        }
        .skill-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            opacity: 0;
            transition: opacity var(--transition-base);
        }
        .skill-card:hover::before { opacity: 1; }
        .skill-card:hover {
            border-color: rgba(201,169,110,0.2);
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }
        .skill-icon { font-size: 2.4rem; margin-bottom: 0.9rem; display: block; color: var(--accent); }
        .skill-card h3 { font-size: 1.05rem; font-weight: 600; margin-bottom: 0.5rem; }
        .skill-card p { color: var(--gris); font-size: 0.88rem; }

        .about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; align-items: center; max-width: 1200px; margin: 0 auto; }
        .about-image { position: relative; border-radius: var(--radius-lg); overflow: hidden; background: var(--gris-fonce); aspect-ratio: 4/3; display: flex; align-items: center; justify-content: center; color: var(--gris); font-size: 0.9rem; border: 1px solid rgba(255,255,255,0.05); transition: transform var(--transition-slow); }
        .about-image:hover { transform: translateY(-4px); }
        .about-image .icon-large { font-size: 4rem; opacity: 0.2; }
        .about-image::before { content: ''; position: absolute; top: 20px; left: 20px; right: -20px; bottom: -20px; border: 2px solid var(--accent); border-radius: var(--radius-lg); z-index: -1; opacity: 0.15; transition: all var(--transition-slow); }
        .about-image:hover::before { opacity: 0.3; transform: translate(-5px, -5px); }
        .about-content h2 { font-family: 'Playfair Display', Georgia, serif; font-size: clamp(1.6rem, 3vw, 2.3rem); margin-bottom: 1.2rem; }
        .about-content p { color: var(--gris); margin-bottom: 1.2rem; font-size: 1.02rem; }
        .about-content strong { color: var(--blanc); font-weight: 600; }
        .competences-list { display: flex; flex-wrap: wrap; gap: 0.7rem; margin-top: 1.5rem; }
        .competence-tag { padding: 0.5rem 1.2rem; background: var(--accent-dim); border: 1px solid rgba(201,169,110,0.15); color: var(--accent); border-radius: var(--radius-full); font-size: 0.8rem; font-weight: 500; transition: all var(--transition-fast); cursor: default; }
        .competence-tag:hover { background: rgba(201,169,110,0.15); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(201,169,110,0.15); }

        .contact-section { background: var(--gris-fonce); text-align: center; }
        .contact-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2.5rem; max-width: 900px; margin: 2.5rem auto 0; }
        .contact-item { padding: 1.5rem; transition: transform var(--transition-base); }
        .contact-item:hover { transform: translateY(-4px); }
        .contact-icon { width: 56px; height: 56px; background: var(--accent-dim); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; font-size: 1.4rem; color: var(--accent); transition: all var(--transition-base); border: 1px solid rgba(201,169,110,0.1); }
        .contact-item:hover .contact-icon { background: rgba(201,169,110,0.15); transform: scale(1.08); box-shadow: 0 0 20px rgba(201,169,110,0.15); }
        .contact-item h3 { font-size: 0.95rem; margin-bottom: 0.4rem; font-weight: 600; }
        .contact-item a { color: var(--gris); text-decoration: none; transition: color var(--transition-base); font-size: 0.92rem; position: relative; }
        .contact-item a::after { content: ''; position: absolute; bottom: -2px; left: 0; width: 0; height: 1px; background: var(--accent); transition: width var(--transition-base); }
        .contact-item a:hover { color: var(--accent); }
        .contact-item a:hover::after { width: 100%; }
        .contact-item a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
        .contact-item span { color: var(--gris); font-size: 0.92rem; }

        .social-links { display: flex; justify-content: center; gap: 1.2rem; margin-top: 2.5rem; }
        .social-links a { width: 48px; height: 48px; border: 1px solid rgba(255,255,255,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--gris); text-decoration: none; transition: all var(--transition-base); font-size: 1.1rem; position: relative; }
        .social-links a:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-4px); box-shadow: 0 8px 20px rgba(201,169,110,0.15); }
        .social-links a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        .contact-form-wrapper { max-width: 600px; margin: 3rem auto 0; text-align: left; }
        .form-group { margin-bottom: 1.3rem; }
        .form-group label { display: block; font-size: 0.82rem; font-weight: 500; color: var(--gris-clair); margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-group input, .form-group textarea { width: 100%; padding: 0.9rem 1.1rem; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: var(--radius-sm); color: var(--blanc); font-family: inherit; font-size: 0.95rem; transition: all var(--transition-base); }
        .form-group input:focus, .form-group textarea:focus { outline: none; border-color: var(--accent); background: rgba(255,255,255,0.06); box-shadow: 0 0 0 3px rgba(201,169,110,0.1); }
        .form-group textarea { min-height: 140px; resize: vertical; }
        .form-group input::placeholder, .form-group textarea::placeholder { color: var(--gris); opacity: 0.6; }
        .form-status { margin-top: 1rem; padding: 0.8rem 1.2rem; border-radius: var(--radius-sm); font-size: 0.9rem; display: none; animation: fadeInUp 0.4s ease; }
        .form-status.success { background: rgba(34,197,94,0.1); color: #4ade80; border: 1px solid rgba(34,197,94,0.2); display: block; }
        .form-status.error { background: rgba(239,68,68,0.1); color: #f87171; border: 1px solid rgba(239,68,68,0.2); display: block; }

        .back-to-top { position: fixed; bottom: 2rem; right: 2rem; width: 48px; height: 48px; border-radius: 50%; background: var(--accent); color: var(--noir); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; opacity: 0; transform: translateY(20px); transition: all var(--transition-base); z-index: 999; box-shadow: 0 4px 15px rgba(201,169,110,0.3); }
        .back-to-top.visible { opacity: 1; transform: translateY(0); }
        .back-to-top:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(201,169,110,0.4); }
        .back-to-top:focus-visible { outline: 2px solid var(--blanc); outline-offset: 2px; }

        footer { text-align: center; padding: 2.5rem; border-top: 1px solid rgba(255,255,255,0.04); color: var(--gris); font-size: 0.82rem; }
        footer span { color: var(--accent); }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .reveal { opacity: 0; transform: translateY(40px); transition: opacity 0.8s ease, transform 0.8s ease; }
        .reveal.active { opacity: 1; transform: translateY(0); }
        @media (prefers-reduced-motion: reduce) { .reveal { opacity: 1; transform: none; transition: none; } .hero-tag::before, .hero::before { animation: none; } }

        @media (max-width: 1024px) { .about-grid { grid-template-columns: 1fr; gap: 3rem; } .contact-grid { grid-template-columns: 1fr; gap: 1.5rem; } .hero-image { width: 320px; height: 400px; right: 2%; } }
        @media (max-width: 768px) {
            nav { padding: 0 1.25rem; }
            .nav-links { position: fixed; top: var(--nav-height); left: 1rem; right: 1rem; flex-direction: column; gap: 0; padding: 0.5rem; background: rgba(18,18,18,0.98); border-radius: var(--radius-md); border: 1px solid rgba(255,255,255,0.06); box-shadow: var(--shadow-lg); transform: translateY(-10px); opacity: 0; pointer-events: none; transition: all var(--transition-base); display: flex; }
            .nav-links.open { transform: translateY(0); opacity: 1; pointer-events: all; }
            .nav-links a { padding: 1rem 1.2rem; border-radius: var(--radius-sm); }
            .nav-links a:hover { background: rgba(255,255,255,0.03); }
            .nav-links a::after { display: none; }
            .menu-toggle { display: inline-flex; }
            .hero { padding: calc(var(--nav-height) + 1.5rem) 1.25rem 3rem; min-height: auto; align-items: flex-start; }
            .hero-image { display: none; }
            .hero-buttons { flex-direction: column; align-items: stretch; }
            .btn { justify-content: center; }

function initInteractions() {
    // Menu mobile
    const toggle = document.getElementById('menuToggle');
    const navLinks = document.getElementById('navLinks');
    const navLinkItems = navLinks.querySelectorAll('a');

    function closeMenu() {
        navLinks.classList.remove('open');
        toggle.setAttribute('aria-expanded', 'false');
        toggle.textContent = '☰';
    }

    toggle.addEventListener('click', () => {
        const isOpen = navLinks.classList.toggle('open');
        toggle.setAttribute('aria-expanded', isOpen);
        toggle.textContent = isOpen ? '✕' : '☰';
    });

    navLinkItems.forEach(link => link.addEventListener('click', closeMenu));

    // Fermeture avec la touche Échap
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && navLinks.classList.contains('open')) {
            closeMenu();
        }
    });

    document.addEventListener('click', (e) => {
        if (!toggle.contains(e.target) && !navLinks.contains(e.target) && navLinks.classList.contains('open')) {
            closeMenu();
        }
    });

    // Navbar scroll + active section
    const nav = document.getElementById('navbar');
    const sections = document.querySelectorAll('section[id], header[id]');
    const navLinksAll = document.querySelectorAll('.nav-links a');

    function updateNav() {
        const scrollY = window.scrollY;
        nav.classList.toggle('scrolled', scrollY > 60);
        let current = '';
        sections.forEach(section => {
            const sectionTop = section.offsetTop - 100;
            if (scrollY >= sectionTop) current = section.getAttribute('id');
        });
        navLinksAll.forEach(link => {
            link.classList.toggle('active', link.getAttribute('href') === '#' + current);
        });
    }
    window.addEventListener('scroll', updateNav, { passive: true });
    updateNav();

    // Scroll reveal
    const reveals = document.querySelectorAll('.reveal');
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('active');
                observer.unobserve(entry.target);
            }
        });
    }, { threshold: 0.12, rootMargin: '0px 0px -30px 0px' });
    reveals.forEach(el => observer.observe(el));

    // Back to top
    const backToTop = document.getElementById('backToTop');
    window.addEventListener('scroll', () => {
        backToTop.classList.toggle('visible', window.scrollY > 600);
    }, { passive: true });
    backToTop.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // Formulaire - gestion des erreurs de validation (en plus de la validation HTML)
    const contactForm = document.getElementById('contactForm');
    const formStatus = document.getElementById('formStatus');

    if (contactForm) {
        contactForm.addEventListener('submit', (e) => {
            // On laisse la validation HTML native faire son travail, mais on garde une vérification JS pour les messages personnalisés
            const name = contactForm.querySelector('#name').value.trim();
            const email = contactForm.querySelector('#email').value.trim();
            const subject = contactForm.querySelector('#subject').value.trim();
            const message = contactForm.querySelector('#message').value.trim();

            if (!name || !email || !subject || !message) {
                e.preventDefault(); // On empêche l'envoi si manquant (en plus de la validation HTML)
                showStatus(window.formMessages.error_empty, 'error');
                return;
            }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                e.preventDefault();
                showStatus(window.formMessages.error_email, 'error');
                return;
            }
            // Sinon, le formulaire sera soumis normalement vers l'action définie.
            // Si vous utilisez un service comme Formspree, le message sera envoyé.
            // Pour une simulation sans backend, on peut conserver le comportement précédent.
            // Mais ici, on laisse la soumission réelle.
            // Pour éviter une redirection, on peut utiliser fetch, mais on garde simple.
        });
    }

    function showStatus(msg, type) {
        formStatus.textContent = msg;
        formStatus.className = 'form-status ' + type;
        setTimeout(() => { formStatus.className = 'form-status'; }, 6000);
    }
}

async function loadData() {
    try {
        const response = await fetch('data.json');
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const data = await response.json();
        initPortfolio(data);
    } catch (err) {
        console.warn('Impossible de charger data.json, utilisation du fallback. Erreur:', err.message);
        initPortfolio(fallbackData);
    }
}

// Lancer
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', loadData);
} else {
    loadData();
}
</script>
